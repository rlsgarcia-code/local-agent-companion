[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-client"
version = "1.0.4"
requires-python = ">=3.12"
description = "Dependency-light Python client for the local Companion Agent API"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["companion_client*"]
