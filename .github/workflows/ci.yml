name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-2025
            target: win32-x64

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build the approved SQLite native dependency for bundled Node
        run: npm rebuild better-sqlite3 --ignore-scripts=false

      - name: Audit production dependencies and time-bounded mitigations
        run: npm run audit:prod

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Verify local Chat Completions routing
        run: npm run smoke:litellm

      - name: Build headless engine with the exact bundled Node
        run: npm run engine:build

      - name: Upload development engine for compatibility testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: companion-engine-${{ matrix.target }}
          path: engine-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Build extension with the runner-native ChromaDB binary
        run: npm run build

      - name: Verify the local packaging entrypoint on Windows
        if: matrix.target == 'win32-x64'
        run: npm run package

      - name: Verify activation and sidebar commands in Linux VS Code Extension Host
        if: matrix.target == 'linux-x64'
        run: xvfb-run -a npm run test:extension-host

      - name: Verify activation and sidebar commands in Windows VS Code Extension Host
        if: matrix.target == 'win32-x64'
        run: npm run test:extension-host

      - name: Verify bundled local ChromaDB lifecycle
        run: npm run smoke:chroma

      - name: Package platform-specific VSIX
        run: npx --no-install vsce package --no-dependencies --target ${{ matrix.target }} --out local-agent-companion-${{ matrix.target }}.vsix

      - name: Install and activate the packaged Linux VSIX in VS Code
        if: matrix.target == 'linux-x64'
        run: xvfb-run -a npm run test:vsix-install -- local-agent-companion-linux-x64.vsix

      - name: Install and activate the packaged Windows VSIX in VS Code
        if: matrix.target == 'win32-x64'
        run: npm run test:vsix-install -- local-agent-companion-win32-x64.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: local-agent-companion-${{ matrix.target }}
          path: local-agent-companion-${{ matrix.target }}.vsix
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
