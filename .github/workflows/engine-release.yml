name: Draft Companion engine release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      - run: npm run check
      - run: npm test
      - run: npm run smoke:litellm
      - run: npm run engine:build
      - name: Sign the exact engine manifest
        run: npm run engine:package
        env:
          COMPANION_RELEASE_SIGNING_KEY: ${{ secrets.COMPANION_RELEASE_SIGNING_KEY }}
      - name: Build thin SDK bundles
        if: matrix.target == 'linux-x64'
        run: node scripts/build-sdks.mjs
        env:
          COMPANION_RELEASE_SIGNING_KEY: ${{ secrets.COMPANION_RELEASE_SIGNING_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-engine-${{ matrix.target }}
          path: |
            release/engine/*
            release/companion-sdks-*.tar.gz*
          if-no-files-found: error
  draft:
    needs: engine
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: signed-engine-*
          path: release-assets
          merge-multiple: true
      - name: Create reviewable draft; never publish or promote automatically
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/create-engine-draft.py
